<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration: MRI image fused with live ultrasound to guide a needle to a suspicious prostate area">
  <rect width="720" height="300" fill="#eef6fb" rx="12"/>
  <!-- MRI panel -->
  <rect x="30" y="40" width="190" height="190" rx="10" fill="#1c2733"/>
  <ellipse cx="125" cy="135" rx="62" ry="52" fill="#6b7d8c"/>
  <ellipse cx="140" cy="120" rx="17" ry="13" fill="#f2c14e" stroke="#e8572a" stroke-width="3"/>
  <text x="125" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#0b3d5c">1. MRI shows target</text>
  <!-- plus -->
  <text x="248" y="145" font-family="Arial" font-size="40" fill="#0b3d5c">+</text>
  <!-- US panel -->
  <rect x="285" y="40" width="190" height="190" rx="10" fill="#1c2733"/>
  <path d="M380 60 L290 225 L470 225 Z" fill="#3b4a57"/>
  <ellipse cx="380" cy="150" rx="55" ry="45" fill="#8596a4"/>
  <text x="380" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#0b3d5c">2. Live ultrasound</text>
  <!-- arrow -->
  <text x="498" y="145" font-family="Arial" font-size="40" fill="#0b3d5c">=</text>
  <!-- fusion panel -->
  <rect x="530" y="40" width="165" height="190" rx="10" fill="#1c2733"/>
  <ellipse cx="612" cy="140" rx="55" ry="45" fill="#8596a4"/>
  <ellipse cx="622" cy="128" rx="15" ry="12" fill="none" stroke="#e8572a" stroke-width="3" stroke-dasharray="4 3"/>
  <line x1="690" y1="215" x2="624" y2="130" stroke="#bfe3f7" stroke-width="3"/>
  <text x="612" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#0b3d5c">3. Fusion-guided needle</text>
  <text x="360" y="285" text-anchor="middle" font-family="Arial" font-size="12" fill="#5b6b7a">Schematic illustration, not a real patient image</text>
</svg>

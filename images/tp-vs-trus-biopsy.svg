<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 970 610" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="3D-style illustration comparing transrectal biopsy, where the needle crosses the rectum, with transperineal biopsy, where the needle passes through the skin of the perineum and avoids the rectum">
<defs>
  <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#eaf3e8"/></linearGradient>
  <linearGradient id="tissue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8eadb"/><stop offset="1" stop-color="#e0c2a3"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9c9b2"/><stop offset="1" stop-color="#d4856a"/></linearGradient>
  <radialGradient id="bladder" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#d9edce"/><stop offset=".6" stop-color="#9cc08f"/><stop offset="1" stop-color="#6c9865"/></radialGradient>
  <radialGradient id="prostate" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f8b695"/><stop offset=".55" stop-color="#df7a49"/><stop offset="1" stop-color="#b0502a"/></radialGradient>
  <linearGradient id="probe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5f7f9"/><stop offset=".5" stop-color="#b2bbc3"/><stop offset="1" stop-color="#7a858f"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="4" dy="7" stdDeviation="6" flood-color="#3b2a1a" flood-opacity=".28"/></filter>
  <filter id="sh2" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#2b1a0e" flood-opacity=".32"/></filter>
  <clipPath id="tc"><rect x="150" y="70" width="250" height="340" rx="44"/></clipPath>

  <g id="anatomy">
    <rect x="0" y="0" width="470" height="545" rx="18" fill="url(#pbg)" stroke="#d5e2d6"/>
    <!-- pelvic tissue block -->
    <rect x="150" y="70" width="250" height="340" rx="44" fill="url(#tissue)" filter="url(#sh)"/>
    <!-- rectum tube -->
    <g clip-path="url(#tc)" fill="none">
      <path d="M355 60 C352 190 358 280 346 345 L348 420" stroke="#a46658" stroke-width="56"/>
      <path d="M355 60 C352 190 358 280 346 345 L348 420" stroke="#d99e8d" stroke-width="47"/>
      <path d="M347 60 C344 190 350 280 338 345 L340 420" stroke="#f1cdbf" stroke-width="15" opacity=".85"/>
    </g>
    <!-- bladder + urethra -->
    <ellipse cx="258" cy="135" rx="62" ry="42" fill="url(#bladder)" filter="url(#sh2)"/>
    <ellipse cx="258" cy="140" rx="42" ry="24" fill="#dcefd2" opacity=".6"/>
    <rect x="255" y="170" width="14" height="34" rx="5" fill="#9cc08f"/>
    <!-- prostate -->
    <ellipse cx="262" cy="235" rx="54" ry="44" fill="url(#prostate)" filter="url(#sh2)"/>
    <ellipse cx="243" cy="217" rx="22" ry="11" fill="#fff" opacity=".3"/>
    <path d="M230 247 q10 -9 20 0 M264 256 q12 -9 22 0 M280 222 q8 -7 16 0" stroke="#a24a25" opacity=".4" fill="none" stroke-width="2" stroke-linecap="round"/>
    <!-- skin of perineum -->
    <rect x="150" y="398" width="250" height="16" rx="8" fill="url(#skin)" filter="url(#sh2)"/>
    <rect x="162" y="401" width="226" height="3" rx="1.5" fill="#fff" opacity=".4"/>
    <!-- ultrasound probe in rectum -->
    <rect x="338" y="205" width="20" height="245" rx="10" fill="url(#probe)" filter="url(#sh2)"/>
    <rect x="329" y="438" width="38" height="44" rx="9" fill="url(#probe)" filter="url(#sh2)"/>
    <!-- leader lines + labels -->
    <g stroke="#4d5c6a" stroke-width="1.4" fill="#4d5c6a">
      <line x1="144" y1="136" x2="200" y2="136"/><circle cx="200" cy="136" r="3.2"/>
      <line x1="144" y1="236" x2="216" y2="236"/><circle cx="216" cy="236" r="3.2"/>
      <line x1="144" y1="407" x2="182" y2="407"/><circle cx="182" cy="407" r="3.2"/>
      <line x1="406" y1="172" x2="372" y2="172"/><circle cx="372" cy="172" r="3.2"/>
    </g>
    <g font-size="15" font-weight="700" fill="#1c2733">
      <text x="138" y="141" text-anchor="end">Bladder</text>
      <text x="138" y="241" text-anchor="end">Prostate</text>
      <text x="138" y="412" text-anchor="end">Skin (perineum)</text>
      <text x="410" y="177">Rectum</text>
    </g>
    <g font-size="13" font-weight="600" fill="#4d5c6a">
      <text x="372" y="466">Ultrasound</text><text x="372" y="482">probe</text>
    </g>
  </g>
</defs>

<text x="485" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0b3d5c">Transrectal vs transperineal prostate biopsy</text>

<!-- Panel 1: transrectal -->
<g transform="translate(10,56)">
  <use href="#anatomy"/>
  <circle cx="327" cy="238" r="14" fill="#e8572a" opacity=".28" stroke="#e8572a" stroke-dasharray="3 2"/>
  <line x1="340" y1="240" x2="288" y2="236" stroke="#3f4a54" stroke-width="3.6" stroke-linecap="round"/>
  <text x="235" y="514" text-anchor="middle" font-size="19" font-weight="700" fill="#1c2733">Transrectal (older)</text>
  <text x="235" y="536" text-anchor="middle" font-size="14" font-weight="600" fill="#c0392b">Needle crosses the rectum: higher infection risk</text>
</g>

<!-- Panel 2: transperineal -->
<g transform="translate(490,56)">
  <use href="#anatomy"/>
  <circle cx="262" cy="406" r="15" fill="#2a9d8f" opacity=".28" stroke="#2a9d8f" stroke-dasharray="3 2"/>
  <line x1="262" y1="460" x2="262" y2="226" stroke="#b8860b" stroke-width="4.2" stroke-linecap="round"/>
  <rect x="250" y="452" width="24" height="30" rx="5" fill="#d8a91c" stroke="#9c7608"/>
  <text x="250" y="330" text-anchor="end" font-size="13" font-weight="700" fill="#8a6a00">Needle</text>
  <text x="235" y="514" text-anchor="middle" font-size="19" font-weight="700" fill="#1c2733">Transperineal (modern)</text>
  <text x="235" y="536" text-anchor="middle" font-size="14" font-weight="600" fill="#1f7a6f">Needle enters through skin and avoids the rectum</text>
</g>
</svg>

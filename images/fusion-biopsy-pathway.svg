<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five-step patient pathway for MRI fusion biopsy">
  <rect width="720" height="150" fill="#eef6fb" rx="12"/>
  <g font-family="Arial" font-size="13" text-anchor="middle" fill="#fff">
    <circle cx="70" cy="60" r="32" fill="#0b3d5c"/><text x="70" y="65">PSA</text>
    <circle cx="210" cy="60" r="32" fill="#0b3d5c"/><text x="210" y="65">MRI</text>
    <circle cx="350" cy="60" r="32" fill="#e8572a"/><text x="350" y="65">Fusion</text>
    <circle cx="490" cy="60" r="32" fill="#0b3d5c"/><text x="490" y="65">Report</text>
    <circle cx="630" cy="60" r="32" fill="#2a9d8f"/><text x="630" y="65">Plan</text>
  </g>
  <g stroke="#0b3d5c" stroke-width="3"><line x1="104" y1="60" x2="176" y2="60"/><line x1="244" y1="60" x2="316" y2="60"/><line x1="384" y1="60" x2="456" y2="60"/><line x1="524" y1="60" x2="596" y2="60"/></g>
  <g font-family="Arial" font-size="11.5" text-anchor="middle" fill="#1c2733">
    <text x="70" y="115">Blood test &amp;</text><text x="70" y="130">consultation</text>
    <text x="210" y="115">Prostate MRI</text><text x="210" y="130">(PI-RADS score)</text>
    <text x="350" y="115">Targeted +</text><text x="350" y="130">systematic cores</text>
    <text x="490" y="115">Pathology</text><text x="490" y="130">(Gleason / ISUP)</text>
    <text x="630" y="115">Surveillance,</text><text x="630" y="130">surgery or focal</text>
  </g>
</svg>

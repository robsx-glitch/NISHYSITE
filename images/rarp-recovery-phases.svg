<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,Helvetica,sans-serif;width:100%;height:auto" role="img" aria-label="Illustrative recovery phases after nerve-sparing robotic prostatectomy: healing, early recovery, rehabilitation, long-term recovery">
<defs>
<linearGradient id="cv" x1="0" x2="1"><stop offset="0" stop-color="#e0a33a"/><stop offset=".5" stop-color="#2a9d8f"/><stop offset="1" stop-color="#0b3d5c"/></linearGradient>
<linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a9d8f" stop-opacity=".22"/><stop offset="1" stop-color="#2a9d8f" stop-opacity="0"/></linearGradient>
</defs>
<rect width="900" height="500" fill="#fff"/>
<text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0b3d5c">Recovery after nerve-sparing robotic prostatectomy: four phases</text>
<g>
<rect x="70" y="56" width="140" height="296" fill="#fdf3dc"/>
<rect x="210" y="56" width="170" height="296" fill="#e6f4f1"/>
<rect x="380" y="56" width="230" height="296" fill="#dcebf5"/>
<rect x="610" y="56" width="230" height="296" fill="#e9eef5"/>
</g>
<g font-size="13" font-weight="700" text-anchor="middle">
<text x="140" y="78" fill="#9a6a0a">PHASE 1</text><text x="295" y="78" fill="#1d7a6f">PHASE 2</text><text x="495" y="78" fill="#0b3d5c">PHASE 3</text><text x="725" y="78" fill="#33465a">PHASE 4</text>
</g>
<g font-size="12.5" text-anchor="middle" fill="#33465a">
<text x="140" y="96">Healing</text><text x="295" y="96">Early recovery</text><text x="495" y="96">Rehabilitation</text><text x="725" y="96">Long-term recovery</text>
</g>
<line x1="70" y1="352" x2="840" y2="352" stroke="#5b6b7a" stroke-width="1.5"/>
<line x1="70" y1="56" x2="70" y2="352" stroke="#5b6b7a" stroke-width="1.5"/>
<text x="26" y="204" transform="rotate(-90 26 204)" text-anchor="middle" font-size="12.5" fill="#5b6b7a">Return of function (illustrative)</text>
<path d="M70,330 C150,325 190,300 250,262 C330,214 400,170 500,142 C600,118 700,108 840,102 L840,352 L70,352 Z" fill="url(#ar)"/>
<path d="M70,330 C150,325 190,300 250,262 C330,214 400,170 500,142 C600,118 700,108 840,102" fill="none" stroke="url(#cv)" stroke-width="5" stroke-linecap="round"/>
<circle cx="70" cy="330" r="6" fill="#e0a33a"/><circle cx="840" cy="102" r="6" fill="#0b3d5c"/>
<g font-size="12" fill="#33465a" text-anchor="middle">
<text x="140" y="378" font-weight="700">Weeks 0 to 2</text><text x="295" y="378" font-weight="700">Weeks 2 to 12</text><text x="495" y="378" font-weight="700">Months 3 to 12</text><text x="725" y="378" font-weight="700">Months 12 to 24</text>
</g>
<g font-size="11.5" fill="#33465a" text-anchor="middle">
<text x="140" y="398">Catheter in, rest,</text><text x="140" y="413">walking, wound care</text>
<text x="295" y="398">Catheter out, leakage</text><text x="295" y="413">settles, pelvic floor work</text>
<text x="495" y="398">Nerves recover; erection</text><text x="495" y="413">rehabilitation plan</text>
<text x="725" y="398">Gradual gains continue;</text><text x="725" y="413">PSA follow-up</text>
</g>
<g font-size="11.5" fill="#33465a">
<rect x="82" y="112" width="116" height="40" rx="6" fill="#fff" stroke="#e0a33a"/><text x="140" y="129" text-anchor="middle">Catheter removed</text><text x="140" y="144" text-anchor="middle">at about 7 days</text>
</g>
<text x="450" y="452" text-anchor="middle" font-size="12" fill="#5b6b7a">Urinary control usually returns first; erections can keep improving for 1 to 2 years. Recovery varies from man to man.</text>
<text x="450" y="474" text-anchor="middle" font-size="11" fill="#8a97a3">Schematic illustration, not individual outcomes.</text>
</svg>
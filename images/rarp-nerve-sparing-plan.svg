<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1030 590" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,Helvetica,sans-serif;width:100%;height:auto" role="img" aria-label="Illustration of nerve-sparing prostatectomy: both neurovascular bundles preserved, or one bundle removed on the side of the cancer">
<defs>
  <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#eaf3e8"/></linearGradient>
  <radialGradient id="bladder" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#d9edce"/><stop offset=".6" stop-color="#9cc08f"/><stop offset="1" stop-color="#6c9865"/></radialGradient>
  <radialGradient id="prostate" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f8b695"/><stop offset=".55" stop-color="#df7a49"/><stop offset="1" stop-color="#b0502a"/></radialGradient>
  <radialGradient id="sv" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#f7e0d2"/><stop offset="1" stop-color="#d9a891"/></radialGradient>
  <linearGradient id="ure" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2dccb"/><stop offset="1" stop-color="#c99f86"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#3b2a1a" flood-opacity=".28"/></filter>
  <filter id="sh2" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#2b1a0e" flood-opacity=".3"/></filter>
</defs>
<text x="515" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0b3d5c">Nerve-sparing radical prostatectomy: the surgical plan is side-specific</text>
<g transform="translate(10,52)">
    <rect x="0" y="0" width="500" height="470" rx="18" fill="url(#pbg)" stroke="#d5e2d6"/>
    <ellipse cx="178" cy="176" rx="40" ry="15" transform="rotate(-18 178 176)" fill="url(#sv)" filter="url(#sh2)"/>
    <ellipse cx="322" cy="176" rx="40" ry="15" transform="rotate(18 322 176)" fill="url(#sv)" filter="url(#sh2)"/>
    <ellipse cx="250" cy="112" rx="98" ry="50" fill="url(#bladder)" filter="url(#sh)"/>
    <ellipse cx="250" cy="118" rx="64" ry="28" fill="#dcefd2" opacity=".55"/>
    <rect x="237" y="335" width="26" height="70" rx="11" fill="url(#ure)" filter="url(#sh2)"/>
    <path d="M148 200 C120 260 125 330 170 385" fill="none" stroke="#c9961c" stroke-width="15" stroke-linecap="round"/><path d="M148 200 C120 260 125 330 170 385" fill="none" stroke="#f3d56b" stroke-width="6" stroke-linecap="round"/>
    <path d="M352 200 C380 260 375 330 330 385" fill="none" stroke="#c9961c" stroke-width="15" stroke-linecap="round"/><path d="M352 200 C380 260 375 330 330 385" fill="none" stroke="#f3d56b" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="250" cy="268" rx="88" ry="78" fill="url(#prostate)" filter="url(#sh)"/>
    <ellipse cx="228" cy="240" rx="34" ry="16" fill="#fff" opacity=".28"/>
    
    <ellipse cx="250" cy="268" rx="96" ry="88" fill="none" stroke="#1c2733" stroke-width="2" stroke-dasharray="7 5"/>
    <g stroke="#4d5c6a" stroke-width="1.4" fill="#4d5c6a">
      <line x1="128" y1="112" x2="150" y2="112"/><circle cx="150" cy="112" r="3.2"/>
      <line x1="128" y1="176" x2="150" y2="176"/><circle cx="150" cy="176" r="3.2"/>
      <line x1="128" y1="404" x2="232" y2="404"/><circle cx="232" cy="404" r="3.2"/>
      <line x1="385" y1="268" x2="310" y2="268"/><circle cx="310" cy="268" r="3.2"/>
      <line x1="392" y1="338" x2="368" y2="318"/><circle cx="368" cy="318" r="3.2"/>
    </g>
    <g font-size="14" font-weight="700" fill="#1c2733">
      <text x="122" y="117" text-anchor="end">Bladder</text>
      <text x="122" y="181" text-anchor="end">Seminal vesicles</text>
      <text x="122" y="409" text-anchor="end">Urethra</text>
      <text x="392" y="273">Prostate</text>
      <text x="396" y="338">Neurovascular</text><text x="396" y="356">bundle</text>
    </g>
  <text x="250" y="498" text-anchor="middle" font-size="18" font-weight="700" fill="#1c2733">Both nerve bundles preserved</text>
  <text x="250" y="520" text-anchor="middle" font-size="14" font-weight="600" fill="#1f7a6f">Dashed line = surgical plane, hugging the prostate</text>
</g>
<g transform="translate(520,52)">
    <rect x="0" y="0" width="500" height="470" rx="18" fill="url(#pbg)" stroke="#d5e2d6"/>
    <ellipse cx="178" cy="176" rx="40" ry="15" transform="rotate(-18 178 176)" fill="url(#sv)" filter="url(#sh2)"/>
    <ellipse cx="322" cy="176" rx="40" ry="15" transform="rotate(18 322 176)" fill="url(#sv)" filter="url(#sh2)"/>
    <ellipse cx="250" cy="112" rx="98" ry="50" fill="url(#bladder)" filter="url(#sh)"/>
    <ellipse cx="250" cy="118" rx="64" ry="28" fill="#dcefd2" opacity=".55"/>
    <rect x="237" y="335" width="26" height="70" rx="11" fill="url(#ure)" filter="url(#sh2)"/>
    <path d="M148 200 C120 260 125 330 170 385" fill="none" stroke="#aab2b9" stroke-width="13" stroke-linecap="round" stroke-dasharray="3 7" opacity=".8"/>
    <path d="M352 200 C380 260 375 330 330 385" fill="none" stroke="#c9961c" stroke-width="15" stroke-linecap="round"/><path d="M352 200 C380 260 375 330 330 385" fill="none" stroke="#f3d56b" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="250" cy="268" rx="88" ry="78" fill="url(#prostate)" filter="url(#sh)"/>
    <ellipse cx="228" cy="240" rx="34" ry="16" fill="#fff" opacity=".28"/>
    <circle cx="180" cy="262" r="15" fill="#d6332b" stroke="#fff" stroke-width="3"/>
    <path d="M250 182 C155 176 100 225 100 290 C100 340 132 372 180 376 L310 376 C358 372 350 330 344 280 C338 218 320 182 250 182 Z" fill="none" stroke="#1c2733" stroke-width="2" stroke-dasharray="7 5"/>
    <g stroke="#4d5c6a" stroke-width="1.4" fill="#4d5c6a">
      <line x1="128" y1="112" x2="150" y2="112"/><circle cx="150" cy="112" r="3.2"/>
      <line x1="128" y1="176" x2="150" y2="176"/><circle cx="150" cy="176" r="3.2"/>
      <line x1="128" y1="404" x2="232" y2="404"/><circle cx="232" cy="404" r="3.2"/>
      <line x1="385" y1="268" x2="310" y2="268"/><circle cx="310" cy="268" r="3.2"/>
      <line x1="392" y1="338" x2="368" y2="318"/><circle cx="368" cy="318" r="3.2"/>
    </g>
    <g font-size="14" font-weight="700" fill="#1c2733">
      <text x="122" y="117" text-anchor="end">Bladder</text>
      <text x="122" y="181" text-anchor="end">Seminal vesicles</text>
      <text x="122" y="409" text-anchor="end">Urethra</text>
      <text x="392" y="273">Prostate</text>
      <text x="396" y="338">Neurovascular</text><text x="396" y="356">bundle</text>
    </g>
  <text x="250" y="498" text-anchor="middle" font-size="18" font-weight="700" fill="#1c2733">Wider excision on the side of the cancer</text>
  <text x="250" y="520" text-anchor="middle" font-size="14" font-weight="600" fill="#c0392b">The bundle beside the tumour is sacrificed, the other is kept</text>
  <g font-size="14" font-weight="700" fill="#d6332b"><text x="120" y="212" text-anchor="end">Tumour</text></g>
  <line x1="126" y1="209" x2="168" y2="250" stroke="#d6332b" stroke-width="1.6"/>
</g>
</svg>